<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="p">
        <h2>Create Account</h2>
            <div class="b">
                <div class="g">
                    <p>Frist name *</p>
                    <input type="text" placeholder="Enter your First name">
                </div>
                <div class="g">
                    <p>Last name</p>
                    <input type="text" placeholder="Enter your Last name">
                </div>
                <div class="g e">
                    <p>Email</p>
                    <input type="text" placeholder="Enter your Email">
                </div>
                <div class="g">
                    <p>Password*</p>
                    <input type="text" placeholder="Enter your Password">
                </div>
                <div class="g">
                    <p>Comfrim Password*</p>
                    <input type="text" placeholder="Comfrim Password">
                </div>
                <div class="g">
                    <p>Gender</p>
                    <div class="options">
                        <label><input type="radio" name="gender"> Male</label>
                        <label><input type="radio" name="gender"> Female</label>
                    </div>
                </div>
                <div class="g">
                    <p>Hobbies</p>
                    <div class="options">
                        <label><input type="checkbox"> Music</label>
                        <label><input type="checkbox"> Sport</label>
                        <label><input type="checkbox"> Travel</label>
                        <label><input type="checkbox"> Movies</label>
                    </div>
                </div>
                <div class="g">
                    <p>Source of Income</p>
                    <select>
                        <option>Employed</option>
                        <option>Self-employed</option>
                        <option>Unemployed</option>
                        <option>Student</option>
                    </select>
                </div>
                <div class="g">
                    <p>Incomes</p>
                    <div class="income">
                        <input type="range" min="0" max="100" value="20">
                        <span>20K</span>
                    </div>
                </div>
                <div class="g">
                    <p>Upload Profile Picture</p>
                    <input type="file">
                </div>
                <div class="g">
                    <p>Age</p>
                    <input type="text" value="18">
                </div>
                <div class="g e">
                    <p>Bio</p>
                    <textarea rows="5"></textarea>
                </div>
            </div>
            <div class="footer">
                    <button class="r"type="submit">Create</button>
            </div>
        </div>
    </div>
</body>
</html>
