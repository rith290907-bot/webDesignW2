<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 4 - Profile Card</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <!-- div container for the card -->
    <div class="card">
      <!-- image element for the profile picture -->
      <img class="avatar" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQXPlcmXH9AAFBzOdszw0RbOvHJ5dHGsH3YBhmzhgmo4NihOLYRTCoeaY&s=10" alt="Profile picture of Cat" />

      <!-- heading for the name -->
      <h2>Bong Meow</h2>

      <!-- inline CSS used on this element -->
      <p style="color: #8a94a6; font-size: 13px; margin-top: 0;">UI/UX Mobile Designer</p>

      <div class="stats">
        <div><span>Projects</span><strong>17</strong></div>
        <div><span>Following</span><strong>159</strong></div>
        <div><span>Followers</span><strong>205</strong></div>
      </div>

      <!-- paragraph for a short bio -->
      <p class="bio">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed et est et velit ornare ultrices.
      </p>

      <!-- button for interaction -->
      <button class="btn">View Profile</button>
    </div>
  </body>
</html>
